<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRUE WALK - Secure Payment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(circle at top left, rgba(22,163,74,.12), transparent 35%),
        radial-gradient(circle at bottom right, rgba(34,197,94,.08), transparent 35%),
        #07110b;
      color: #fff;
      min-height: 100vh;
    }

    .page {
      width: 100%;
      max-width: 520px;
      margin: auto;
      min-height: 100vh;
      padding: 18px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back-btn {
      text-decoration: none;
      color: #fff;
      background: #102018;
      border: 1px solid #1d3b29;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      border-radius: 10px;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 800;
    }

    .payment-card {
      background: rgba(11,26,17,.96);
      border: 1px solid #1d3b29;
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .page-subtitle {
      color: #94a99b;
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .error-box {
      display: none;
      margin-bottom: 18px;
      padding: 13px 14px;
      border-radius: 13px;
      background: #351313;
      border: 1px solid #743030;
      color: #ffb4b4;
      font-size: 13px;
      line-height: 1.5;
    }

    .error-box.show {
      display: block;
    }

    .plan-box {
      background: linear-gradient(135deg,#10291a,#0c1d13);
      border: 1px solid #235b36;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 22px;
    }

    .plan-label {
      color: #8ea596;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .plan-name {
      font-size: 21px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    .amount-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 14px;
      border-top: 1px solid #21402c;
    }

    .amount-label {
      color: #91a497;
      font-size: 13px;
    }

    .amount {
      font-size: 25px;
      font-weight: 900;
      color: #4ade80;
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .upi-option {
      display: flex;
      align-items: center;
      gap: 14px;
      background: #0b1b11;
      border: 1px solid #2c8b49;
      border-radius: 17px;
      padding: 17px;
      margin-bottom: 20px;
    }

    .upi-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #153c23;
      color: #4ade80;
      font-size: 22px;
      font-weight: 900;
      flex-shrink: 0;
    }

    .upi-text {
      flex: 1;
    }

    .upi-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .upi-desc {
      color: #8da194;
      font-size: 12px;
      line-height: 1.4;
    }

    .selected {
      width: 21px;
      height: 21px;
      border-radius: 50%;
      background: #22c55e;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #041108;
      font-size: 13px;
      font-weight: 900;
    }

    .pay-btn {
      width: 100%;
      border: none;
      background: linear-gradient(135deg,#22c55e,#16a34a);
      color: #fff;
      font-size: 16px;
      font-weight: 900;
      padding: 17px;
      border-radius: 16px;
      cursor: pointer;
    }

    .pay-btn:disabled {
      opacity: .65;
      cursor: not-allowed;
    }

    .security-box {
      margin-top: 18px;
      padding: 14px;
      border-radius: 14px;
      background: #0a1710;
      border: 1px solid #1b3525;
      color: #8ea195;
      font-size: 12px;
      line-height: 1.6;
      text-align: center;
    }

    .security-box strong {
      color: #d7e6dc;
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      border: 2px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media(max-width:430px) {
      .page {
        padding: 14px;
      }

      .payment-card {
        padding: 20px;
      }

      .page-title {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <div class="header">

    <a href="plans.html" class="back-btn">
      ← Back
    </a>

    <div class="brand">

      <img
        src="assets/Logo.png"
        alt="TRUE WALK"
        onerror="this.style.display='none'"
      >

      <div class="brand-name">
        TRUE WALK
      </div>

    </div>

  </div>


  <div class="payment-card">

    <h1 class="page-title">
      Complete Your Deposit
    </h1>

    <p class="page-subtitle">
      Review your selected plan and continue securely using UPI.
    </p>


    <div id="errorBox" class="error-box"></div>


    <div class="plan-box">

      <div class="plan-label">
        Selected Plan
      </div>

      <div
        class="plan-name"
        id="planName"
      >
        Loading...
      </div>

      <div class="amount-row">

        <div class="amount-label">
          Deposit Amount
        </div>

        <div
          class="amount"
          id="amount"
        >
          ₹0
        </div>

      </div>

    </div>


    <div class="section-title">
      Payment Method
    </div>


    <div class="upi-option">

      <div class="upi-icon">
        ₹
      </div>

      <div class="upi-text">

        <div class="upi-title">
          UPI Payment
        </div>

        <div class="upi-desc">
          Pay securely using your preferred UPI app.
        </div>

      </div>

      <div class="selected">
        ✓
      </div>

    </div>


    <button
      type="button"
      class="pay-btn"
      id="payBtn"
    >
      Pay with UPI
    </button>


    <div class="security-box">
      🔒 <strong>Secure Payment</strong><br>
      Payment is processed through the configured payment gateway.
    </div>

  </div>

</div>


<script>

  // =====================================================
  // GET PLAN + AMOUNT FROM URL
  // =====================================================

  const params =
    new URLSearchParams(
      window.location.search
    );

  const planNameFromUrl =
    params.get("plan") || "";

  const amountFromUrl =
    Number(
      params.get("amount") || 0
    );


  // =====================================================
  // ELEMENTS
  // =====================================================

  const planNameElement =
    document.getElementById("planName");

  const amountElement =
    document.getElementById("amount");

  const payBtn =
    document.getElementById("payBtn");

  const errorBox =
    document.getElementById("errorBox");


  // =====================================================
  // FORMAT INR
  // =====================================================

  function formatAmount(value) {

    return new Intl.NumberFormat(
      "en-IN",
      {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
      }
    ).format(value);

  }


  // =====================================================
  // ERROR
  // =====================================================

  function showError(message) {

    errorBox.textContent = message;

    errorBox.classList.add("show");

  }


  function hideError() {

    errorBox.textContent = "";

    errorBox.classList.remove("show");

  }


  // =====================================================
  // INITIALIZE PLAN
  // =====================================================

  if (
    !planNameFromUrl ||
    !Number.isFinite(amountFromUrl) ||
    amountFromUrl < 200
  ) {

    planNameElement.textContent =
      "Invalid Plan";

    amountElement.textContent =
      "₹0";

    payBtn.disabled = true;

    showError(
      "Invalid plan or amount. Please go back and select a valid plan."
    );

  } else {

    planNameElement.textContent =
      planNameFromUrl;

    amountElement.textContent =
      formatAmount(amountFromUrl);

  }


  // =====================================================
  // LOADING
  // =====================================================

  function setLoading(loading) {

    if (loading) {

      payBtn.disabled = true;

      payBtn.innerHTML =
        '<span class="spinner"></span>Opening Secure Payment...';

    } else {

      payBtn.disabled = false;

      payBtn.textContent =
        "Pay with UPI";

    }

  }


  // =====================================================
  // OPEN RSPAY PAYMENT
  // =====================================================

  function createPayment() {
  const plan = planNameFromUrl;

  if (!plan) {
    showError('Invalid payment plan.');
    return;
  }

  setLoading(true);

  window.location.href =
    `/api/payment/go?plan=${encodeURIComponent(plan)}`;
}

    setLoading(true);

    /*
      IMPORTANT:

      Do NOT use fetch() here.

      The backend route:
      /api/payment/go

      will call the RSPay API,
      receive data.payUrl,
      and redirect directly
      to the actual RSPay payment page.
    */

    const paymentUrl =
      "/api/payment/go" +
      "?plan=" +
      encodeURIComponent(planNameFromUrl) +
      "&amount=" +
      encodeURIComponent(amountFromUrl);

    window.location.href =
      paymentUrl;

  }


  // =====================================================
  // PAY BUTTON
  // =====================================================

  payBtn.addEventListener(
    "click",
    createPayment
  );

</script>

</body>
</html>
