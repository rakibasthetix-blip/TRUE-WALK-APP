<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRUE WALK</title>
  <link rel="stylesheet" href="css/style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #111;
    }

    .hero {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
      text-align: center;
    }

    .hero-box {
      width: 100%;
      max-width: 480px;
      background: #fff;
      border-radius: 25px;
      padding: 40px 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
    }

    .logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 800;
    }

    .subtitle {
      color: #777;
      margin: 12px 0 30px;
      font-size: 15px;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 30px;
    }

    .feature {
      background: #f8f8f8;
      padding: 16px 10px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
    }

    .get-start {
      display: block;
      width: 100%;
      padding: 16px;
      border-radius: 13px;
      background: #ff7a00;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
    }

    .register-link {
      display: block;
      margin-top: 18px;
      color: #ff7a00;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>

<body>

  <div class="hero">
    <div class="hero-box">

      <img src="assets/logo.png" alt="TRUE WALK Logo" class="logo">

      <h1>TRUE WALK</h1>

      <p class="subtitle">
        Welcome to TRUE WALK
      </p>

      <div class="features">
        <div class="feature">Easy Register</div>
        <div class="feature">Secure Login</div>
        <div class="feature">Multiple Plans</div>
        <div class="feature">24/7 Support</div>
      </div>

      <!-- Get Start अब सीधे Home/Dashboard नहीं खोलेगा -->
      <a href="login.html" class="get-start">
        GET START
      </a>

      <a href="register.html" class="register-link">
        Create New Account
      </a>

    </div>
  </div>

</body>
</html>
